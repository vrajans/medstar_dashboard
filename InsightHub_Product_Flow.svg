<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="s2" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="a2g" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="a2a" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1240" height="58" fill="url(#hdr2)"/>
  <text x="32" y="29" fill="#fff" font-size="22" font-weight="700">InsightHub — End-to-End Product &amp; Data Flow</text>
  <text x="32" y="48" fill="#E0F2FE" font-size="12.5">From raw upload to governed, persistent, AI-driven insight — in one platform, one click</text>

  <!-- STEP boxes helper visual style. Row 1 -->
  <!-- 1 Source -->
  <g filter="url(#s2)"><rect x="32" y="92" width="176" height="96" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/></g>
  <circle cx="60" cy="118" r="13" fill="#DC2626"/><text x="60" y="123" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="80" y="122" fill="#1E293B" font-size="13" font-weight="700">Ingest</text>
  <text x="48" y="148" fill="#475569" font-size="10.5">Upload Excel/CSV</text>
  <text x="48" y="164" fill="#475569" font-size="10.5">or connector sync</text>
  <text x="48" y="180" fill="#475569" font-size="10.5">or ERP file-drop</text>

  <!-- 2 Profile + Detect -->
  <g filter="url(#s2)"><rect x="248" y="92" width="176" height="96" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/></g>
  <circle cx="276" cy="118" r="13" fill="#2563EB"/><text x="276" y="123" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="296" y="122" fill="#1E293B" font-size="13" font-weight="700">Profile &amp; Detect</text>
  <text x="264" y="148" fill="#475569" font-size="10.5">Column profiling</text>
  <text x="264" y="164" fill="#475569" font-size="10.5">Domain detection</text>
  <text x="264" y="180" fill="#475569" font-size="10.5">+ confidence score</text>

  <!-- Decision diamond -->
  <g filter="url(#s2)">
    <polygon points="552,92 636,140 552,188 468,140" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="552" y="132" fill="#1E293B" font-size="11.5" font-weight="700" text-anchor="middle">Fits a</text>
  <text x="552" y="148" fill="#1E293B" font-size="11.5" font-weight="700" text-anchor="middle">known domain?</text>

  <!-- 3a domain ETL (yes) -->
  <g filter="url(#s2)"><rect x="680" y="72" width="200" height="60" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/></g>
  <text x="780" y="98" fill="#0D9488" font-size="12" font-weight="700" text-anchor="middle">YES → Domain ETL</text>
  <text x="780" y="118" fill="#475569" font-size="10.5" text-anchor="middle">tuned transform (pharmacy,</text>
  <text x="780" y="118" fill="#475569" font-size="10.5" text-anchor="middle" dy="14">SaaS, retail, accounting…)</text>

  <!-- 3b playground (no) -->
  <g filter="url(#s2)"><rect x="680" y="148" width="200" height="60" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/></g>
  <text x="780" y="174" fill="#7C3AED" font-size="12" font-weight="700" text-anchor="middle">NO → Ad hoc Playground</text>
  <text x="780" y="194" fill="#475569" font-size="10.5" text-anchor="middle">name it · generic profile</text>

  <!-- arrows row1 -->
  <line x1="208" y1="140" x2="244" y2="140" stroke="#2563EB" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="424" y1="140" x2="464" y2="140" stroke="#2563EB" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="636" y1="120" x2="676" y2="102" stroke="#059669" stroke-width="2" marker-end="url(#a2g)"/>
  <text x="648" y="104" fill="#059669" font-size="10" font-weight="700">yes</text>
  <line x1="636" y1="160" x2="676" y2="178" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>
  <text x="648" y="184" fill="#7C3AED" font-size="10" font-weight="700">no</text>

  <!-- Human-in-the-loop note -->
  <g filter="url(#s2)"><rect x="248" y="210" width="376" height="40" rx="9" fill="#fff" stroke="#CBD5E1"/></g>
  <text x="264" y="234" fill="#475569" font-size="10.5">🧑 Optional human-in-the-loop: admin confirms detected domain / column mapping before first load</text>
  <line x1="380" y1="188" x2="380" y2="208" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a2)"/>

  <!-- Row 2 : converge to Transform/Load -->
  <!-- 4 Transform -->
  <g filter="url(#s2)"><rect x="680" y="270" width="200" height="72" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/></g>
  <circle cx="708" cy="296" r="13" fill="#D97706"/><text x="708" y="301" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text x="728" y="300" fill="#1E293B" font-size="13" font-weight="700">Transform</text>
  <text x="696" y="322" fill="#475569" font-size="10.5">dbt + Polars · quality tests</text>
  <text x="696" y="337" fill="#475569" font-size="10.5">orchestrated (event-driven)</text>

  <!-- converge arrows to transform -->
  <line x1="780" y1="132" x2="780" y2="266" stroke="#D97706" stroke-width="2" marker-end="url(#a2a)"/>
  <line x1="780" y1="208" x2="780" y2="266" stroke="#D97706" stroke-width="2"/>

  <!-- 5 Load DW -->
  <g filter="url(#s2)"><rect x="680" y="368" width="200" height="72" rx="12" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.5"/></g>
  <circle cx="708" cy="394" r="13" fill="#1E293B"/><text x="708" y="399" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">5</text>
  <text x="728" y="398" fill="#1E293B" font-size="13" font-weight="700">Load Warehouse</text>
  <text x="696" y="420" fill="#475569" font-size="10.5">star schema · SCD2 upsert</text>
  <text x="696" y="435" fill="#475569" font-size="10.5">idempotent (re-upload safe)</text>
  <line x1="780" y1="342" x2="780" y2="364" stroke="#1E293B" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 6 Serving marts -->
  <g filter="url(#s2)"><rect x="680" y="466" width="200" height="66" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/></g>
  <circle cx="708" cy="492" r="13" fill="#0D9488"/><text x="708" y="497" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">6</text>
  <text x="728" y="496" fill="#1E293B" font-size="13" font-weight="700">Serving Marts</text>
  <text x="696" y="518" fill="#475569" font-size="10.5">flattened + semantic layer</text>
  <line x1="780" y1="440" x2="780" y2="462" stroke="#0D9488" stroke-width="2" marker-end="url(#a2g)"/>

  <!-- 7 Analytics + AI (big) -->
  <g filter="url(#s2)"><rect x="380" y="560" width="500" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/></g>
  <circle cx="408" cy="588" r="13" fill="#2563EB"/><text x="408" y="593" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">7</text>
  <text x="428" y="592" fill="#1E293B" font-size="13" font-weight="700">Analytics + AI Insight</text>
  <text x="396" y="616" fill="#475569" font-size="10.5">Domain KPIs · trends · cash flow · cohorts   |   Grounded narrative · NL Q&amp;A</text>
  <text x="396" y="633" fill="#475569" font-size="10.5">Forecasting · anomaly explanation   |   Llama default or BYO paid LLM · tenant-scoped RAG</text>
  <line x1="780" y1="532" x2="780" y2="556" stroke="#2563EB" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 8 Alerts + Clients -->
  <g filter="url(#s2)"><rect x="32" y="466" width="300" height="66" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/></g>
  <circle cx="60" cy="492" r="13" fill="#7C3AED"/><text x="60" y="497" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">8</text>
  <text x="80" y="496" fill="#1E293B" font-size="13" font-weight="700">Proactive Alerts</text>
  <text x="48" y="518" fill="#475569" font-size="10.5">threshold + anomaly → email · SMS · WhatsApp · Slack</text>

  <g filter="url(#s2)"><rect x="32" y="560" width="300" height="92" rx="12" fill="#ECFEFF" stroke="#0EA5E9" stroke-width="1.5"/></g>
  <circle cx="60" cy="588" r="13" fill="#0EA5E9"/><text x="60" y="593" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">9</text>
  <text x="80" y="592" fill="#1E293B" font-size="13" font-weight="700">Serve to Clients</text>
  <text x="48" y="616" fill="#475569" font-size="10.5">Next.js web app · Executive PWA/mobile</text>
  <text x="48" y="633" fill="#475569" font-size="10.5">Internal Dash cockpit · all RBAC-scoped</text>

  <!-- arrows from analytics to alerts + clients -->
  <line x1="378" y1="606" x2="336" y2="606" stroke="#0EA5E9" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 380 580 Q 200 560 182 538" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>

  <!-- persistence loop callout -->
  <g filter="url(#s2)"><rect x="32" y="270" width="376" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/></g>
  <text x="48" y="294" fill="#059669" font-size="12.5" font-weight="700">♻ Persistence &amp; History (the moat)</text>
  <text x="48" y="315" fill="#475569" font-size="10.5">Every load accumulates in the warehouse — this month sits</text>
  <text x="48" y="330" fill="#475569" font-size="10.5">next to last month automatically. A chat window starts from zero.</text>

  <!-- governance rail bottom -->
  <g filter="url(#s2)"><rect x="32" y="676" width="1188" height="46" rx="10" fill="#1E293B"/></g>
  <text x="52" y="704" fill="#fff" font-size="11.5"><tspan font-weight="700">Governed throughout:</tspan>  RBAC at the query layer on every step · full audit &amp; lineage · encryption · GDPR/CCPA · data-quality gates · per-tenant isolation (tested every release)</text>

  <text x="32" y="748" fill="#94A3B8" font-size="10.5">Steps 1–2 are seconds. Steps 4–6 run automatically on every load. The customer experiences: "upload → in under a minute, governed analytics + AI I can trust, that stay current and watch themselves."</text>
</svg>
