    <text x="834" y="421" font-size="10" fill="#475569" text-anchor="middle">domain-adaptive, currency-aware (REUSE)</text>
  </g>

  <!-- 5 Data Platform (ETL) -->
  <g filter="url(#sh)"><rect x="32" y="458" width="960" height="72" rx="10" fill="#FFFBEB" stroke="#FDE68A"/></g>
  <rect x="32" y="458" width="150" height="72" rx="10" fill="#D97706"/>
  <text x="107" y="490" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">5 · PIPELINE</text>
  <text x="107" y="508" fill="#FEF3C7" font-size="10" text-anchor="middle">Transform</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="473" width="230" height="42" rx="8" fill="#fff" stroke="#FCD34D"/>
    <text x="320" y="493" font-weight="700" text-anchor="middle">Orchestrator</text>
    <text x="320" y="507" font-size="10" fill="#475569" text-anchor="middle">Dagster / Prefect · event-driven (NEW)</text>
    <rect x="450" y="473" width="230" height="42" rx="8" fill="#fff" stroke="#FCD34D"/>
    <text x="565" y="493" font-weight="700" text-anchor="middle">dbt + Polars</text>
    <text x="565" y="507" font-size="10" fill="#475569" text-anchor="middle">domain-aware transforms (NEW)</text>
    <rect x="695" y="473" width="278" height="42" rx="8" fill="#fff" stroke="#FCD34D"/>
    <text x="834" y="493" font-weight="700" text-anchor="middle">Data Quality Tests</text>
    <text x="834" y="507" font-size="10" fill="#475569" text-anchor="middle">nulls · ranges · freshness · lineage (NEW)</text>
  </g>

  <!-- 6 Warehouse -->
  <g filter="url(#sh)"><rect x="32" y="544" width="960" height="86" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/></g>
  <rect x="32" y="544" width="150" height="86" rx="10" fill="#1E293B"/>
  <text x="107" y="582" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">6 · WAREHOUSE</text>
  <text x="107" y="600" fill="#CBD5E1" font-size="10" text-anchor="middle">Postgres</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="560" width="230" height="54" rx="8" fill="#fff" stroke="#94A3B8"/>
    <text x="320" y="582" font-weight="700" text-anchor="middle">Star Schema DW</text>
    <text x="320" y="599" font-size="10" fill="#475569" text-anchor="middle">conformed facts + dims · SCD2 (NEW)</text>
    <rect x="450" y="560" width="230" height="54" rx="8" fill="#fff" stroke="#94A3B8"/>
    <text x="565" y="582" font-weight="700" text-anchor="middle">Ad hoc Playground Store</text>
    <text x="565" y="599" font-size="10" fill="#475569" text-anchor="middle">named, tenant-namespaced (NEW)</text>
    <rect x="695" y="560" width="278" height="54" rx="8" fill="#fff" stroke="#94A3B8"/>
    <text x="834" y="582" font-weight="700" text-anchor="middle">pgvector</text>
    <text x="834" y="599" font-size="10" fill="#475569" text-anchor="middle">embeddings co-located w/ rows (REFACTOR)</text>
  </g>

