<svg viewBox="0 0 1240 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1240" height="940" fill="#F8FAFC"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1240" height="60" fill="url(#hdr)"/>
  <text x="32" y="30" fill="#fff" font-size="22" font-weight="700">InsightHub — Technical Architecture</text>
  <text x="32" y="49" fill="#CBD5E1" font-size="12.5">AI-Powered Data &amp; Analytics Platform · SMB-right-sized, enterprise-enable · layered view</text>
  <text x="1208" y="38" fill="#93C5FD" font-size="11" text-anchor="end">v1.0 · July 2026</text>

  <!-- ============ Main stack (left ~960px) ============ -->
  <!-- Layer template: box + label chip -->

  <!-- 1 Clients -->
  <g filter="url(#sh)">
    <rect x="32" y="80" width="960" height="86" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  </g>
  <rect x="32" y="80" width="150" height="86" rx="10" fill="#2563EB"/>
  <text x="107" y="118" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1 · CLIENTS</text>
  <text x="107" y="137" fill="#DBEAFE" font-size="10" text-anchor="middle">Experience layer</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="98" width="230" height="50" rx="8" fill="#fff" stroke="#93C5FD"/>
    <text x="320" y="120" font-weight="700" text-anchor="middle">Next.js Web App</text>
    <text x="320" y="137" font-size="10.5" fill="#475569" text-anchor="middle">customer-facing (NEW)</text>
    <rect x="450" y="98" width="230" height="50" rx="8" fill="#fff" stroke="#93C5FD"/>
    <text x="565" y="120" font-weight="700" text-anchor="middle">Executive PWA / Mobile</text>
    <text x="565" y="137" font-size="10.5" fill="#475569" text-anchor="middle">read-only KPIs &amp; alerts (NEW)</text>
    <rect x="695" y="98" width="278" height="50" rx="8" fill="#fff" stroke="#CBD5E1"/>
    <text x="834" y="120" font-weight="700" text-anchor="middle">Internal Dash Cockpit</text>
    <text x="834" y="137" font-size="10.5" fill="#475569" text-anchor="middle">ops &amp; prototyping (REUSE)</text>
  </g>

  <!-- 2 API / Gateway -->
  <g filter="url(#sh)"><rect x="32" y="180" width="960" height="72" rx="10" fill="#ECFEFF" stroke="#A5F3FC"/></g>
  <rect x="32" y="180" width="150" height="72" rx="10" fill="#0EA5E9"/>
  <text x="107" y="212" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2 · API</text>
  <text x="107" y="230" fill="#E0F2FE" font-size="10" text-anchor="middle">Gateway</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="195" width="230" height="42" rx="8" fill="#fff" stroke="#67E8F9"/>
    <text x="320" y="221" font-weight="700" text-anchor="middle">FastAPI Services (REUSE)</text>
    <rect x="450" y="195" width="230" height="42" rx="8" fill="#fff" stroke="#67E8F9"/>
    <text x="565" y="215" font-weight="700" text-anchor="middle">Auth: SSO + MFA</text>
    <text x="565" y="230" font-size="10" fill="#475569" text-anchor="middle">Google OAuth · TOTP (REUSE)</text>
    <rect x="695" y="195" width="278" height="42" rx="8" fill="#fff" stroke="#67E8F9"/>
    <text x="834" y="215" font-weight="700" text-anchor="middle">RBAC Enforcement Point</text>
    <text x="834" y="230" font-size="10" fill="#475569" text-anchor="middle">tenant + intra-tenant, at query layer</text>
  </g>

  <!-- 3 AI Layer -->
  <g filter="url(#sh)"><rect x="32" y="266" width="960" height="92" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/></g>
  <rect x="32" y="266" width="150" height="92" rx="10" fill="#7C3AED"/>
  <text x="107" y="305" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3 · AI</text>
  <text x="107" y="323" fill="#EDE9FE" font-size="10" text-anchor="middle">Intelligence</text>
  <g font-size="11.5" fill="#1E293B">
    <rect x="205" y="281" width="230" height="62" rx="8" fill="#fff" stroke="#C4B5FD"/>
    <text x="320" y="303" font-weight="700" text-anchor="middle">LLM Gateway</text>
    <text x="320" y="320" font-size="10" fill="#475569" text-anchor="middle">Llama/Groq default +</text>
    <text x="320" y="334" font-size="10" fill="#475569" text-anchor="middle">BYO paid provider (REFACTOR)</text>
    <rect x="450" y="281" width="230" height="62" rx="8" fill="#fff" stroke="#C4B5FD"/>
    <text x="565" y="303" font-weight="700" text-anchor="middle">Agent Framework</text>
    <text x="565" y="320" font-size="10" fill="#475569" text-anchor="middle">schema · analytics · forecast</text>
    <text x="565" y="334" font-size="10" fill="#475569" text-anchor="middle">insight · quality (REUSE)</text>
    <rect x="695" y="281" width="278" height="62" rx="8" fill="#fff" stroke="#C4B5FD"/>
    <text x="834" y="303" font-weight="700" text-anchor="middle">RAG + Semantic Grounding</text>
    <text x="834" y="320" font-size="10" fill="#475569" text-anchor="middle">direct-injection + pgvector retrieval</text>
    <text x="834" y="334" font-size="10" fill="#475569" text-anchor="middle">tenant-scoped, guardrailed</text>
  </g>

  <!-- 4 Analytics / Serving -->
  <g filter="url(#sh)"><rect x="32" y="372" width="960" height="72" rx="10" fill="#F0FDFA" stroke="#99F6E4"/></g>
  <rect x="32" y="372" width="150" height="72" rx="10" fill="#0D9488"/>
  <text x="107" y="404" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">4 · SERVING</text>
  <text x="107" y="422" fill="#CCFBF1" font-size="10" text-anchor="middle">Analytics</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="387" width="230" height="42" rx="8" fill="#fff" stroke="#5EEAD4"/>
    <text x="320" y="407" font-weight="700" text-anchor="middle">Serving Marts (OBT)</text>
    <text x="320" y="421" font-size="10" fill="#475569" text-anchor="middle">flattened, per-domain</text>
    <rect x="450" y="387" width="230" height="42" rx="8" fill="#fff" stroke="#5EEAD4"/>
    <text x="565" y="407" font-weight="700" text-anchor="middle">Semantic Layer</text>
    <text x="565" y="421" font-size="10" fill="#475569" text-anchor="middle">shared metric definitions (NEW)</text>
    <rect x="695" y="387" width="278" height="42" rx="8" fill="#fff" stroke="#5EEAD4"/>
