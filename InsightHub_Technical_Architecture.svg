  <rect x="32" y="644" width="150" height="72" rx="10" fill="#DC2626"/>
  <text x="107" y="676" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">7 · INGEST</text>
  <text x="107" y="694" fill="#FEE2E2" font-size="10" text-anchor="middle">Sources</text>
  <g font-size="12" fill="#1E293B">
    <rect x="205" y="659" width="230" height="42" rx="8" fill="#fff" stroke="#FCA5A5"/>
    <text x="320" y="679" font-weight="700" text-anchor="middle">File Upload</text>
    <text x="320" y="693" font-size="10" fill="#475569" text-anchor="middle">Excel / CSV (REUSE)</text>
    <rect x="450" y="659" width="230" height="42" rx="8" fill="#fff" stroke="#FCA5A5"/>
    <text x="565" y="679" font-weight="700" text-anchor="middle">Scheduled Connectors</text>
    <text x="565" y="693" font-size="10" fill="#475569" text-anchor="middle">POS · e-comm · accounting (NEW)</text>
    <rect x="695" y="659" width="278" height="42" rx="8" fill="#fff" stroke="#FCA5A5"/>
    <text x="834" y="679" font-weight="700" text-anchor="middle">ERP File-Drop Watcher</text>
    <text x="834" y="693" font-size="10" fill="#475569" text-anchor="middle">Square/Shopify/Marg parsers (REUSE)</text>
  </g>

  <!-- flow arrow up the middle -->
  <line x1="120" y1="644" x2="120" y2="170" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="128" y="410" fill="#475569" font-size="9.5" transform="rotate(-90 128 410)">data flows up · requests flow down</text>

  <!-- ============ Cross-cutting rail (right) ============ -->
  <text x="1116" y="98" fill="#1E293B" font-size="12.5" font-weight="700" text-anchor="middle">CROSS-CUTTING</text>
  <g font-size="11" fill="#1E293B">
    <g filter="url(#sh)"><rect x="1012" y="108" width="208" height="92" rx="9" fill="#fff" stroke="#DC2626"/></g>
    <text x="1116" y="130" font-weight="700" fill="#DC2626" text-anchor="middle">Security</text>
    <text x="1116" y="150" font-size="10" text-anchor="middle">Data-layer RBAC</text>
    <text x="1116" y="165" font-size="10" text-anchor="middle">Tenant isolation tests</text>
    <text x="1116" y="180" font-size="10" text-anchor="middle">Encryption · Vault</text>
    <text x="1116" y="194" font-size="10" text-anchor="middle">SAST/DAST/pentest</text>

    <g filter="url(#sh)"><rect x="1012" y="210" width="208" height="92" rx="9" fill="#fff" stroke="#2563EB"/></g>
    <text x="1116" y="232" font-weight="700" fill="#2563EB" text-anchor="middle">Governance</text>
    <text x="1116" y="252" font-size="10" text-anchor="middle">GDPR · CCPA (now)</text>
    <text x="1116" y="267" font-size="10" text-anchor="middle">SOC 2 program (yr 1)</text>
    <text x="1116" y="282" font-size="10" text-anchor="middle">HIPAA/bank (tiered)</text>
    <text x="1116" y="296" font-size="10" text-anchor="middle">DSAR · audit · lineage</text>

    <g filter="url(#sh)"><rect x="1012" y="312" width="208" height="86" rx="9" fill="#fff" stroke="#0D9488"/></g>
    <text x="1116" y="334" font-weight="700" fill="#0D9488" text-anchor="middle">Observability</text>
    <text x="1116" y="354" font-size="10" text-anchor="middle">Logs · metrics · traces</text>
    <text x="1116" y="369" font-size="10" text-anchor="middle">Pipeline run history</text>
    <text x="1116" y="384" font-size="10" text-anchor="middle">Data-freshness SLA</text>

    <g filter="url(#sh)"><rect x="1012" y="408" width="208" height="86" rx="9" fill="#fff" stroke="#D97706"/></g>
    <text x="1116" y="430" font-weight="700" fill="#D97706" text-anchor="middle">Billing &amp; Metering</text>
    <text x="1116" y="450" font-size="10" text-anchor="middle">Stripe · Razorpay (REUSE)</text>
    <text x="1116" y="465" font-size="10" text-anchor="middle">Plan-limit enforcement</text>
    <text x="1116" y="480" font-size="10" text-anchor="middle">Per-tenant usage</text>

    <g filter="url(#sh)"><rect x="1012" y="504" width="208" height="112" rx="9" fill="#fff" stroke="#7C3AED"/></g>
    <text x="1116" y="526" font-weight="700" fill="#7C3AED" text-anchor="middle">Alerts &amp; Notify</text>
    <text x="1116" y="546" font-size="10" text-anchor="middle">Threshold + anomaly</text>
    <text x="1116" y="561" font-size="10" text-anchor="middle">Email · SMS · WhatsApp</text>
    <text x="1116" y="576" font-size="10" text-anchor="middle">Slack (REUSE)</text>
    <text x="1116" y="596" font-size="10" text-anchor="middle">APScheduler digests</text>
  </g>

  <!-- Deployment footer -->
  <g filter="url(#sh)"><rect x="32" y="734" width="1188" height="66" rx="10" fill="#1E293B"/></g>
  <text x="52" y="762" fill="#fff" font-size="13" font-weight="700">DEPLOYMENT</text>
  <text x="52" y="783" fill="#CBD5E1" font-size="11">Containerized · scale-to-zero (Cloud Run / Azure Container Apps) at launch → Kubernetes (GKE/AKS) at scale · managed Postgres (Neon → Cloud SQL) · IaC + CI/CD · secrets in vault</text>

  <!-- Legend -->
  <text x="52" y="828" fill="#1E293B" font-size="11.5" font-weight="700">Legend:</text>
  <rect x="112" y="819" width="12" height="12" rx="2" fill="#fff" stroke="#CBD5E1"/><text x="130" y="829" font-size="11" fill="#475569">REUSE (exists today)</text>
  <rect x="272" y="819" width="12" height="12" rx="2" fill="#fff" stroke="#C4B5FD"/><text x="290" y="829" font-size="11" fill="#475569">REFACTOR (extend existing)</text>
  <rect x="472" y="819" width="12" height="12" rx="2" fill="#fff" stroke="#FCA5A5"/><text x="490" y="829" font-size="11" fill="#475569">NEW (net-new build)</text>

  <text x="52" y="862" fill="#94A3B8" font-size="10.5">Principle: SMB-right-sized stack that scales UP (add Spark/K8s/native mobile when a paying customer's scale requires it) — not a scaled-down enterprise stack.</text>
  <text x="52" y="882" fill="#94A3B8" font-size="10.5">Differentiator: one product performs ingest → transform → model → analyze → AI insight, governed and persistent — vs Power BI/Tableau (build-it-yourself) and ChatGPT/Claude (one-time, ungoverned).</text>
</svg>
