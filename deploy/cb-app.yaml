# Build + push the Next.js customer app. NEXT_PUBLIC_API_URL is a BUILD arg, so
# the FastAPI service must be deployed first. Run from repo root:
#   gcloud builds submit --config deploy/cb-app.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/insighthub/app:latest,_API_URL=https://ih-api-xxxx.run.app \
#     customer_app
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '-t'
      - '${_IMAGE}'
      - '.'
images: ['${_IMAGE}']
options:
  machineType: 'E2_HIGHCPU_8'
