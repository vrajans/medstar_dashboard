# Build + push the FastAPI image. Run from repo root:
#   gcloud builds submit --config deploy/cb-api.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/insighthub/api:latest .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/Dockerfile.api', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
options:
  machineType: 'E2_HIGHCPU_8'
